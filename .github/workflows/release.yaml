on:
  release:
    types:
      published

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Download built ruleset
      uses: actions/download-artifact@v8
      with:
        name: osu.Game.Rulesets.Cubed.dll

    - name: Upload ruleset to release
      run: gh release upload "$RELEASE" osu.Game.Rulesets.Cubed.dll
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RELEASE: ${{ github.event.release.tag_name }}

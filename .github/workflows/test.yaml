name: Build n' Test

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-packages-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-packages

      - name: Restore dependencies
        run: dotnet restore osu.Game.Rulesets.Cubed.Tests

      - name: Build
        run: dotnet build -c Release --no-restore osu.Game.Rulesets.Cubed.Tests

      - name: Test
        run: dotnet test -c Release --no-build --nologo --verbosity normal osu.Game.Rulesets.Cubed.Tests

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          path: osu.Game.Rulesets.Cubed.Tests/bin/Release/net8.0/osu.Game.Rulesets.Cubed.dll
          if-no-files-found: 'error'
